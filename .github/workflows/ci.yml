# =============================================================================
# SISPAT-AGU — CI (qualidade + segurança). SEM deploy.
# =============================================================================
# Falha em: testes/lint/typecheck/build quebrados, bandit MEDIUM+/MEDIUM+,
# pip-audit com qualquer vulnerabilidade conhecida, npm audit high/critical
# (dependências de produção), segredo detectado (gitleaks), achado semgrep
# WARNING/ERROR, trivy HIGH/CRITICAL (fs/config/imagem), compose inválido ou
# com porta fora de 127.0.0.1 / 80/443 / serviço n8n.
#
# Princípios: actions fixadas por SHA de commit, permissões mínimas,
# binários de terceiros verificados por SHA-256, nenhum segredo real
# (testes usam valores fictícios de backend/tests/conftest.py e mocks).
# =============================================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      run_playwright:
        description: "Executar testes Playwright (responsive/a11y/e2e)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  SEMGREP_SEND_METRICS: "off"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (pytest + cobertura) — Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências (pins exatos)
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Lockfile instala com --require-hashes (alvo da imagem)
        if: matrix.python == '3.12'
        run: |
          python -m venv /tmp/lockcheck
          /tmp/lockcheck/bin/pip install --no-deps --require-hashes --only-binary=:all: -r backend/requirements.lock
          /tmp/lockcheck/bin/pip check
      - name: pytest
        working-directory: backend
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Upload cobertura
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - name: npm run build (variáveis públicas fictícias)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-ficticia
        run: npm run build

  # ---------------------------------------------------------------------------
  playwright:
    name: Playwright (opcional)
    if: github.event_name == 'workflow_dispatch' && inputs.run_playwright
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # ---------------------------------------------------------------------------
  security:
    name: Segurança (SAST, SCA, segredos, compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Ferramentas (versões fixadas)
        run: python -m pip install "bandit==1.9.4" "pip-audit==2.10.1" "semgrep==1.180.0"

      - name: bandit (MEDIUM+ severidade e confiança)
        run: bandit -r backend/app -ll -ii

      - name: pip-audit (lockfile com hashes + dev)
        run: |
          pip-audit --progress-spinner off --no-deps --disable-pip -r backend/requirements.lock
          cd backend && pip-audit --progress-spinner off -r requirements-dev.txt

      - name: npm audit (produção, high+)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (completo, informativo — devDeps aceitos/residuais)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: gitleaks (binário verificado por SHA-256)
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --config .gitleaks.toml --redact --no-banner --exit-code 1

      - name: semgrep
        run: |
          semgrep scan --metrics off --error --severity ERROR --severity WARNING \
            --config p/python --config p/flask --config p/typescript --config p/react \
            --config p/secrets --config p/dockerfile --config p/docker-compose \
            --exclude-rule python.lang.security.audit.logging.logger-credential-leak.python-logger-credential-disclosure \
            backend/app frontend/src backend/Dockerfile frontend/Dockerfile \
            docker-compose.yml docker-compose.dev.yml

      - name: trivy fs + config (binário verificado por SHA-256)
        run: |
          curl -sSfL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          /tmp/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs docs .
          /tmp/trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs node_modules --skip-dirs docs .

      - name: docker compose config (sintaxe + portas 127.0.0.1, sem 80/443, sem n8n)
        run: |
          sed -e 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci0dummy0not0a0secret/' .env.example > .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev-db --profile worker config -q
          docker compose -f docker-compose.yml --profile worker config --format json | python scripts/check_compose_ports.py
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile dev-db --profile worker config --format json | python scripts/check_compose_ports.py
          rm -f .env

  # ---------------------------------------------------------------------------
  images:
    name: Imagens Docker (build + trivy image)
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (sem push)
        run: |
          docker build --target runtime -t sispat-agu/backend:ci backend
          docker build --target runtime -t sispat-agu/frontend:ci frontend
      - name: Verificar usuário não-root
        run: |
          test "$(docker image inspect -f '{{.Config.User}}' sispat-agu/backend:ci)" = "10001:10001"
          test "$(docker image inspect -f '{{.Config.User}}' sispat-agu/frontend:ci)" = "10001:10001"
      - name: trivy image (HIGH/CRITICAL com correção disponível)
        run: |
          curl -sSfL -o /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          tar -xzf /tmp/trivy.tgz -C /tmp trivy
          for img in sispat-agu/backend:ci sispat-agu/frontend:ci; do
            /tmp/trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done
