; Configuração do Alembic para o SISPAT-AGU.
; A URL real de conexão NÃO fica neste arquivo: é lida da variável de
; ambiente DATABASE_URL dentro de migrations/env.py.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

; sqlalchemy.url é deliberadamente deixado em branco aqui; env.py sobrescreve
; via DATABASE_URL (ou settings.database_url) em tempo de execução.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
