# SISPAT-AGU - vhost EM USO no CloudPanel (ueato.revizzicar.com.br), 2026-10-20.
# Backend 127.0.0.1:8110, frontend 127.0.0.1:3110. Explicacao em
# docs/deploy/ROTEIRO_VPS_ueato.md (secao 5). Sem segredos.

limit_req_zone  $http_cf_connecting_ip zone=sispat_api:10m       rate=10r/s;
limit_req_zone  $http_cf_connecting_ip zone=sispat_sensitive:10m rate=10r/m;
limit_req_zone  $http_cf_connecting_ip zone=sispat_imports:10m   rate=30r/m;
limit_conn_zone $http_cf_connecting_ip zone=sispat_conn:10m;

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  ssl_certificate_key /etc/nginx/ssl-certificates/ueato.revizzicar.com.br.key;
  ssl_certificate /etc/nginx/ssl-certificates/ueato.revizzicar.com.br.crt;
  server_name ueato.revizzicar.com.br;
  root /home/revizzicar-ueato/htdocs/ueato.revizzicar.com.br;

  access_log /home/revizzicar-ueato/logs/nginx/access.log cloudflare;
  error_log /home/revizzicar-ueato/logs/nginx/error.log;

  if ($scheme != "https") {
    rewrite ^ https://$host$request_uri permanent;
  }

  # O nginx.conf do CloudPanel tem "set_real_ip_from 0.0.0.0/0": qualquer um
  # poderia forjar X-Real-IP e passar pelo filtro abaixo. Esta linha substitui
  # aquela lista NESTE site, então $remote_addr é o IP real da conexão.
  set_real_ip_from 127.0.0.1;

  # Só a Cloudflare conecta (Allow traffic from Cloudflare only; termina em deny all).
  # Por isso CF-Connecting-IP é confiável e é usado como IP real do usuário.
  include /etc/nginx/cloudflare/ips;

  # SEM "include /etc/nginx/global_settings" e SEM add_header:
  # Next.js e Flask já emitem os cabeçalhos de segurança (um emissor por cabeçalho).

  server_tokens off;

  client_max_body_size        2m;
  client_body_buffer_size     64k;
  client_header_buffer_size   4k;
  large_client_header_buffers 4 16k;
  client_body_timeout         15s;
  client_header_timeout       15s;
  send_timeout                30s;
  keepalive_timeout           30s;
  limit_conn sispat_conn 30;
  limit_req_status  429;
  limit_conn_status 429;

  location ^~ /.well-known {
    try_files $uri =404;
  }

  location ~ /\.(?!well-known/) {
    deny all;
    return 404;
  }

  location ~ ^/api/v1/(users/invite|users/activate-invite|security/mfa/) {
    limit_req zone=sispat_sensitive burst=5 nodelay;
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location ~ "^/api/v1/(me|users/[0-9a-fA-F-]{36})/avatar$" {
    client_max_body_size 3m;
    limit_req zone=sispat_api burst=10 nodelay;
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location ^~ /api/v1/imports/ {
    limit_except GET POST OPTIONS { deny all; }
    limit_req zone=sispat_imports burst=10 nodelay;
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    190s;
    proxy_read_timeout    190s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location /api/ {
    limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
    limit_req zone=sispat_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:8110;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_buffering on;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
  }

  location / {
    limit_except GET HEAD POST { deny all; }
    limit_req zone=sispat_api burst=80 nodelay;
    proxy_pass http://127.0.0.1:3110;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout    60s;
    proxy_hide_header X-Powered-By;
  }
}
